name: Build multiplatform debug

on:
  workflow_displatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        type: string
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
    matrix:
      os: [ubuntu-latest, windows-latest]
      build_type: [Debug]
      c_compiler: [gcc, clang, cl]
      include:
        - os: windows-latest
          c_compiler: cl
          cpp_compiler: cl
        - os: ubuntu-latest
          c_compiler: gcc
          cpp_compiler: g++
        - os: ubuntu-latest
          c_compiler: clang
          cpp_compiler: clang++
      exclude:
        - os: windows-latest
          c_compiler: gcc
        - os: windows-latest
          c_compiler: clang
        - os: ubuntu-latest
          c_compiler: cl
    steps:
      - uses actions/checkout@v4
      - name Build:
        run:
          cmake -DCMAKE_BUILD_TYPE=Debug .. && cmake --build .


